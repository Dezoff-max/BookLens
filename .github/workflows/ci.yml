name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publication boundary check
        run: ./script/check_publication.sh
      - name: Build BookLens
        run: swift build --product BookLens
      - name: Run tests
        run: swift test
